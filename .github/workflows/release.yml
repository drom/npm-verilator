name: release

# Builds Verilator per target, stages bin/ + include/ into the matching
# platform package, publishes the 4 platform packages, then the main package.
# Platform packages MUST publish first so the main package's optionalDependencies
# resolve. Triggered by a version tag (v<verilator>.<pkg-rev>, e.g. v5.048.0).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    # NOTE: do NOT use `container:` — it forces the runner's Node 24 runtime
    # inside the manylinux2014 container (glibc 2.17), which Node 24 cannot run
    # on (needs glibc 2.27+). Instead, run on the host and invoke the
    # manylinux2014 container only for the build step via `docker run`.
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
            docker_image: quay.io/pypa/manylinux2014_x86_64
            arch_prefix: ""
            brew_prefix: ""
          # macos-13 (Intel) runners are deprecated/gone. Build darwin-x64 on an
          # arm64 runner (macos-14) via Rosetta 2, using a separate x64 Homebrew
          # at /usr/local (installed under arch -x86_64) for flex/bison/help2man.
          - target: darwin-x64
            runner: macos-14
            docker_image: ""
            arch_prefix: arch -x86_64
            brew_prefix: /usr/local
          - target: darwin-arm64
            runner: macos-14
            docker_image: ""
            arch_prefix: ""
            brew_prefix: /opt/homebrew
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Derive Verilator tag from package version
        id: vtag
        run: |
          # npm version 5.048.0 -> Verilator tag v5.048
          V="$(node -p "require('./package.json').version")"
          MAJOR="${V%%.*}"
          REST="${V#*.}"
          MINOR="${REST%%.*}"
          echo "verilator_tag=v${MAJOR}.${MINOR}" >> "$GITHUB_OUTPUT"
          echo "npm_version=${V}" >> "$GITHUB_OUTPUT"

      - name: Install build prerequisites (macOS)
        if: runner.os == 'macOS'
        env:
          ARCH_PREFIX: ${{ matrix.arch_prefix }}
          BREW_PREFIX: ${{ matrix.brew_prefix }}
        run: |
          # macOS ships bison 2.3 (2008, too old for Verilator, needs 3+) and
          # no flex/autoconf/help2man. help2man is needed by the default make
          # target to build man pages (we trim share/ later, but the build
          # needs it).
          #
          # For darwin-x64 we build on an arm64 runner via Rosetta 2. The arm64
          # Homebrew (/opt/homebrew) tools cannot run under arch -x86_64, so we
          # install a separate x64 Homebrew at /usr/local (the classic Intel
          # prefix) under Rosetta, and use those x64 tools.
          if [ -n "$ARCH_PREFIX" ]; then
            # Install x64 Homebrew at /usr/local if not already present.
            if [ ! -x /usr/local/bin/brew ]; then
              $ARCH_PREFIX /bin/bash -c \
                "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
            fi
            BREW=/usr/local/bin/brew
            $ARCH_PREFIX "$BREW" install bison flex autoconf help2man
          else
            BREW=brew
            "$BREW" install bison flex autoconf help2man
          fi
          # Put the Homebrew flex/bison/autoconf ahead of system ones on PATH.
          echo "$BREW_PREFIX/opt/bison/bin"    >> "$GITHUB_PATH"
          echo "$BREW_PREFIX/opt/flex/bin"     >> "$GITHUB_PATH"
          echo "$BREW_PREFIX/opt/autoconf/bin" >> "$GITHUB_PATH"

      - name: Clone Verilator source
        run: |
          git clone --depth 1 --branch ${{ steps.vtag.outputs.verilator_tag }} \
            https://github.com/verilator/verilator src

      - name: Build inside manylinux2014 container (Linux)
        if: matrix.docker_image != ''
        run: |
          # Build Verilator inside the manylinux2014 container (glibc 2.17) so
          # the resulting binaries run on CentOS 7 and newer. The host runner
          # has modern glibc; only the build runs against the old base.
          docker run --rm -v "$PWD:/work" -w /work ${{ matrix.docker_image }} sh -c '
            set -e
            # devtoolset provides a modern gcc/g++ not on PATH by default.
            if [ -f /opt/rh/devtoolset-2/enable ]; then
              set -a; . /opt/rh/devtoolset-2/enable; set +a
            fi
            # Verilator astgen uses the walrus operator (:=), needing Python 3.8+.
            # manylinux2014 ships python3.6 as system python, but bundles newer
            # CPython under /opt/python/cpNN-cpNN/. Put 3.9 first on PATH.
            for py in /opt/python/cp39-cp39 /opt/python/cp38-cp38; do
              if [ -x "$py/bin/python3" ]; then
                export PATH="$py/bin:$PATH"
                break
              fi
            done
            python3 --version
            # Ensure Verilator build deps are present. help2man is needed by the
            # default make target to build man pages (we trim share/ later, but
            # the build itself still requires it).
            command -v bison    || yum install -y bison
            command -v flex     || yum install -y flex
            command -v perl     || yum install -y perl
            command -v help2man || yum install -y help2man
            # The repo is bind-mounted from the host with a different UID, so git
            # refuses to operate ("dubious ownership"). Mark it safe so the build
            # can read the real revision instead of vUNKNOWN.
            git config --global --add safe.directory /work/src
            cd /work/src
            autoconf
            ./configure --prefix /work/stage
            make -j$(nproc)
            make install
            # Verilator installs headers under share/verilator/include/ (per
            # pkgdatadir in configure.ac), not include/. Move them to the
            # top-level include/ the platform package expects, then drop share/.
            if [ -d /work/stage/share/verilator/include ]; then
              mkdir -p /work/stage/include
              cp -a /work/stage/share/verilator/include/. /work/stage/include/
            fi
            rm -rf /work/stage/share
            # Strip the compiled binaries.
            for bin in verilator_bin verilator_coverage verilator_difftree verilator_ccache_md5; do
              [ -f /work/stage/bin/$bin ] && strip /work/stage/bin/$bin || true
            done
          '
          # Files were created as root inside the container; fix ownership.
          sudo chown -R "$(id -u):$(id -g)" stage/

      - name: Build natively (macOS)
        if: matrix.docker_image == ''
        env:
          ARCH_PREFIX: ${{ matrix.arch_prefix }}
        run: |
          STAGE="$PWD/stage"
          cd src
          # Verilator's flexfix script patches flex output (int -> size_t on
          # LexerInput/LexerOutput) but only for macOS >= 26 (Tahoe). The
          # macos-14 runner is macOS 14/15, where Homebrew flex still generates
          # `int` signatures that clash with FlexLexer.h's `size_t` -> clang
          # error: "out-of-line definition does not match any declaration".
          # Lower the threshold so the patch fires on all macOS versions.
          sed -i '' 's/>= 26/>= 0/' src/flexfix
          # For darwin-x64 we build on an arm64 runner via Rosetta 2.
          # ARCH_PREFIX is "arch -x86_64" for x64, empty for arm64.
          $ARCH_PREFIX autoconf
          $ARCH_PREFIX ./configure --prefix "$STAGE" \
            --disable-partial-static
          $ARCH_PREFIX make -j"$(sysctl -n hw.ncpu)"
          $ARCH_PREFIX make install
          # Verilator installs headers under share/verilator/include/, not
          # include/. Move them to the top-level include/ the platform package
          # expects, then drop share/.
          if [ -d "$STAGE/share/verilator/include" ]; then
            mkdir -p "$STAGE/include"
            cp -a "$STAGE/share/verilator/include/." "$STAGE/include/"
          fi
          rm -rf "$STAGE/share"
          for bin in verilator_bin verilator_coverage verilator_difftree verilator_ccache_md5; do
            [ -f "$STAGE/bin/$bin" ] && strip -x "$STAGE/bin/$bin" || true
          done

      - name: Stage into packages/<target>/
        run: |
          TARGET="${{ matrix.target }}"
          mkdir -p "packages/verilator-${TARGET}"
          cp -a stage/bin "packages/verilator-${TARGET}/bin"
          cp -a stage/include "packages/verilator-${TARGET}/include"
          node scripts/sync-versions.js

      - name: Publish platform package
        run: |
          echo "npm whoami:" && npm whoami
          npm publish --access public
        working-directory: packages/verilator-${{ matrix.target }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-main:
    name: publish main package
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Sync versions
        run: node scripts/sync-versions.js

      - name: Publish main package
        run: |
          echo "npm whoami:" && npm whoami
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
